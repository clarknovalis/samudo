name: Bug report
description: Something in samudo does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. A security problem does not belong
        here; see SECURITY.md for how to report it privately.
  - type: dropdown
    id: where
    attributes:
      label: Where
      description: The part where it happens.
      multiple: true
      options:
        - Server
        - Web UI
        - Android app
        - Command line (samu)
        - Emacs (samu.el)
        - Desktop widget
        - Replica or profiles on a computer
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "`samu --version`, `samu-server --version`, or the version in Android's app info."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, step by step, so someone else can do it again.
      placeholder: |
        1. samu add "Buy milk d:tomorrow"
        2. samu list --available
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages and output help most. Please leave out personal data.
    validations:
      required: true
