# cargo-deny (https://embarkstudios.github.io/cargo-deny/) for `make deny`:
# known vulnerabilities from the RustSec database, the licenses of every
# dependency, and where crates come from. What scripts/license-check.sh
# checks (the MIT crates of this workspace depend on no AGPL-only one)
# stays there: cargo-deny judges licenses for the whole graph, not per
# crate.

[graph]
# Features such as `bundled` (SQLite) only some crates switch on; with all
# of them the bundled SQLite of the app is checked as well.
all-features = true

[advisories]
# A vulnerability or an unmaintained crate fails the check. An exception
# goes here with its RUSTSEC id and the reason it does not apply.
ignore = [
    # basic-toml is unmaintained (no vulnerability). It only reaches us at
    # build time, through uniffi's bindgen (askama's derive macro reading
    # its config), and parses nothing from outside. Goes away with a uniffi
    # whose askama has dropped it.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, via uniffi -> askama_derive; unmaintained, not vulnerable" },
    # chrono and chrono-tz are soft-deprecated in favour of jiff
    # (unmaintained, no vulnerability). They reach us only through rrule
    # and icalendar in samu-core, which exchange dates with it as text;
    # no released version of either has dropped chrono. Goes away when
    # both have moved to jiff, or when they are replaced.
    { id = "RUSTSEC-2026-0543", reason = "chrono: via rrule and icalendar only; unmaintained, not vulnerable, no chrono-free release yet" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz: via rrule only; unmaintained, not vulnerable, no chrono-free release yet" },
]

[licenses]
# Every license the dependency graph carries today, all permissive or weak
# copyleft (MPL-2.0, file-based). A crate under any other license fails
# the check and has to be looked at first.
allow = [
    "0BSD",
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
# Two versions of one crate cost build time, not safety: shown, not fatal.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; a git dependency has to be named here first.
unknown-registry = "deny"
unknown-git = "deny"
