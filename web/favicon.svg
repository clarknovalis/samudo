<svg xmlns="http://www.w3.org/2000/svg" viewBox="3 11 87 87">
  <!-- The broom of ADR 0050 (web/brand/samudo-icon-*.svg) without its tile,
       on a transparent ground and as large as the icon allows: dark in a
       light browser, light in a dark one. -->
  <style>
    .broom { stroke: #1C1C1A; }
    .trail { stroke: #4F6B4A; }
    @media (prefers-color-scheme: dark) {
      .broom { stroke: #EDEBE4; }
      .trail { stroke: #A9C29E; }
    }
  </style>
  <g fill="none" stroke-linecap="round">
    <path class="broom" d="M28 16 L58 60" stroke-width="7"/>
    <path class="broom" d="M58 60 L46 88 M58 60 L55 90 M58 60 L64 90 M58 60 L72 87 M58 60 L79 82" stroke-width="5"/>
    <path class="trail" d="M14 92 H24 M28 92 H34" stroke-width="5"/>
  </g>
</svg>
