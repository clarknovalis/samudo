<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 68">
  <!-- The broom of ADR 0050 (web/brand/samudo-icon-*.svg): the dark tile in
       a light browser, the white one in a dark browser. -->
  <style>
    .tile { fill: #1C1C1A; stroke: none; }
    .broom { stroke: #EDEBE4; }
    .trail { stroke: #A9C29E; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #FFFFFF; stroke: #E4E4DE; }
      .broom { stroke: #1C1C1A; }
      .trail { stroke: #4F6B4A; }
    }
  </style>
  <rect class="tile" x="0.5" y="0.5" width="67" height="67" rx="16.5" stroke-width="1"/>
  <g transform="translate(13 13) scale(0.42)" fill="none" stroke-linecap="round">
    <path class="broom" d="M28 16 L58 60" stroke-width="7"/>
    <path class="broom" d="M58 60 L46 88 M58 60 L55 90 M58 60 L64 90 M58 60 L72 87 M58 60 L79 82" stroke-width="5"/>
    <path class="trail" d="M14 92 H24 M28 92 H34" stroke-width="5"/>
  </g>
</svg>
