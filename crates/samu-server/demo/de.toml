# Demo-Inhalt für das Konto demo-de: Scheibenwelt trifft Galaxis.
#
# Eine Huldigung an Terry Pratchett und Douglas Adams, ohne Zitate aus
# ihren Büchern. Eingebettet in samu-server (src/demo.rs, ADR 0099 §6) und
# geschrieben von `samu-server account add --demo de`. `{+N}`/`{-N}` ist
# das Datum N Tage nach/vor dem Tag des Seedens; eine Zeile `line` ist
# Schnellerfassung (docs/quick-capture.md). `history` eines Habits läuft
# bis gestern: `x` erledigt, Ziffer = Menge, `-` bewusst nicht, `.` nichts.

# --- Eingang: noch nicht eingeordnet ----------------------------------------

inbox = [
  "Wo ist eigentlich die Truhe hin? Sie hat Beine.",
  "Rincewind fragt, ob man vor etwas davonlaufen kann, ohne es zu planen",
  "Idee: Delfine fragen, was sie wussten !",
  { line = "TOD hat angerufen. ER sagt, ES SEI NICHTS DRINGENDES. @Person/TOD", comments = ["Er hat in Großbuchstaben aufgelegt."] },
  "Zettel: Bloß keine Pflanzen kaufen, die zurückreden",
  "Termin beim Zahnarzt der Trolle ausmachen d:+6d",
]

blocks = [
  ["gedicht", "babelfisch"],
  ["lesung", "verlag"],
  ["besen", "hut"],
]

[settings]
due-soon = "P3D"
forecast-done = "on"

