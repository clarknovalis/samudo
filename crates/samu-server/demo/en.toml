# Demo content for the account demo-en: the Disc meets the Galaxy.
#
# A tribute to Terry Pratchett and Douglas Adams, without quotations from
# their books. Embedded in samu-server (src/demo.rs, ADR 0099 §6) and
# written by `samu-server account add --demo en`; the format is described in
# de.toml. The search language of perspectives and scopes is German for now
# (docs/search.md), so their chips are too.

inbox = [
  "Where did the Luggage go? It has legs.",
  "Rincewind asks whether you can run away from something without planning it",
  "Idea: ask the dolphins what they knew !",
  { line = "DEATH called. HE SAYS IT IS NOTHING URGENT. @Person/DEATH", comments = ["He hung up in capital letters."] },
  "Note to self: do not buy plants that talk back",
  "Book an appointment with the troll dentist d:+6d",
]

blocks = [
  ["poem", "babelfish"],
  ["reading", "publisher"],
  ["broom", "hat"],
]

[settings]
due-soon = "P3D"
forecast-done = "on"

[property_links]
wiki = "https://en.wikipedia.org/wiki/{value}"
lspace = "https://wiki.lspace.org/{value}"

