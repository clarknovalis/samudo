[[projects]]
title = "Tidy up L-space"
folder = "Unseen University"
icon = "📚"
review = "1w"
reviewed = true
note = """
The Library is bigger on the inside than on the outside. **Much** bigger.

- Rules: no monkey jokes, bananas are handed in at the entrance
- Beyond shelf 7, do not go on without a string
"""
props = { lspace = "Library" }
tasks = [
  { line = "Restock bananas for the Librarian @Person/Librarian @\"Place/Out and about\" ! d:+1d ~15m", key = "bananas" },
  { line = "Find the lost shelf 7b @\"Place/Unseen University\" ~2h !B", clocks = ["{-3} 14:00-16:30", "{-1} 10:00-11:15"], children = [
    "Tie a string to the entrance ~5m",
    "Pack chalk and food for three days ~10m",
    "Write down the way back (if there is one) ~30m",
  ] },
  "Reclaim lent spell books @Clacks d:+5d ~30m !B",
  { line = "Have a book that bites rebound @\"Place/Unseen University\" !A d:{-1}", comments = ["It nibbled the bookbinder again. Take **two** pairs of leather gloves."] },
  "Switch the call numbers to Ook Decimal Classification ~3h s:+7d @\"Energy/Improbably good\"",
  { line = "Replace the reading lamp in the octarine reading room x:{-2}" },
  { line = "Send reminders to overdue wizards x:{-5}" },
]

