[package]
# On crates.io under the product's name (ADR 0137 §7); in the code and in this
# workspace it stays samu_api and samu-api.
name = "samudo-api"
# Its own semver, independent of the application (ADR 0003 §1): other
# projects depend on this crate. Removing or reinterpreting a field is a new major
# version; a fixture changes only together with this number.
version = "0.1.64"
edition.workspace = true
rust-version.workspace = true
# The rest of samudo is AGPL-3.0-or-later; the wire types may in addition be
# used under MIT or Apache-2.0, so a client can embed them without copyleft
# (ADR 0108 §5). Texts: LICENSE-MIT, LICENSE-APACHE beside this file.
license = "AGPL-3.0-or-later OR MIT OR Apache-2.0"
homepage = "https://samudo.de/"
repository.workspace = true
description = "Wire types of the samu API. serde only, no logic, no I/O."
readme = "README.md"
keywords = ["samudo", "tasks", "todo", "api"]
publish = ["crates-io"]

[lib]
name = "samu_api"

# Nothing from this workspace, ever (ADR 0003 §1): other projects build the
# crate on its own.
[dependencies]
serde = { workspace = true }
uuid = { workspace = true }
jiff = { workspace = true }
# `value` of a change is JSON in the form of the field it sets (ADR 0016).
serde_json = { workspace = true }

[lints]
workspace = true
